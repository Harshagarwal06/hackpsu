<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squid Game: Phone Edition</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="player">
    <div class="shapes">○ △ □</div>
    <h1>Phone Edition</h1>
    <div class="player-number hidden" id="my-number"></div>

    <section id="join-view">
      <p class="muted">Enter the code on the big screen.</p>
      <form id="join-form">
        <input id="code" name="code" placeholder="ROOM CODE" maxlength="4" autocomplete="off" autocapitalize="characters" required>
        <input id="name" name="name" placeholder="Your name" maxlength="16" autocomplete="off" required>
        <button type="submit" id="join-btn">Join &amp; enable motion</button>
      </form>
      <p class="error" id="join-error"></p>
    </section>

    <section id="lobby-view" class="hidden">
      <p>You're in, <strong id="me"></strong>.</p>
      <p class="muted">Room <span id="room"></span> · <span id="lobby-status">Waiting for the host to start.</span></p>
      <p class="muted">Move your phone — you should see this bar move.</p>
    </section>

    <section id="game-view" class="hidden">
      <div class="phone-art" id="phone-art"></div>
      <div class="big-word" id="big-word"></div>
      <p id="game-hint"></p>
      <div class="meter progress" id="progress-meter"><div id="my-progress"></div></div>
      <div class="my-rope hidden" id="my-rope"><div id="my-knot"></div></div>
      <div class="jump-pads hidden" id="jump-pads">
        <div class="pad" id="pad-left"><div class="pad-fill"></div><span>◀ LEFT</span></div>
        <div class="pad" id="pad-right"><div class="pad-fill"></div><span>RIGHT ▶</span></div>
      </div>
      <p class="pot-line hidden" id="pot-line"></p>
      <section class="result-card hidden" id="result-card">
        <div class="result-head" id="result-head"></div>
        <div class="result-prize" id="result-prize"></div>
        <ul class="result-lines" id="result-lines"></ul>
        <div class="result-awards" id="result-awards"></div>
        <p class="muted result-hint">Screenshot this!</p>
      </section>
    </section>

    <div class="meter hidden" id="motion-meter"><div id="my-meter"></div></div>
    <p class="muted" id="wake-note"></p>
    <p class="muted" id="tilt-note"></p>
    <p class="error" id="status-error"></p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/art.js"></script>
  <script src="/player.js"></script>
</body>
</html>
