<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host · Squid Game: Phone Edition</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="host">
    <header>
      <div>
        <div class="shapes">○ △ □</div>
        <h1>Phone Edition</h1>
        <p class="muted">Join at <strong id="join-url"></strong></p>
      </div>
      <div>
        <p class="muted">Room code</p>
        <div class="room-code" id="room-code">····</div>
      </div>
    </header>

    <section class="controls">
      <label class="limit">
        <span>Movement limit <strong id="threshold-value"></strong></span>
        <input type="range" id="threshold" step="0.1" disabled>
        <span class="muted">Lower = stricter. Movement past the white line on a player's bar counts.</span>
      </label>
      <div class="buttons">
        <button id="start-btn" disabled>Start Red Light, Green Light</button>
        <button id="tug-btn" disabled>Start Tug of War</button>
        <button id="end-btn" class="secondary hidden">End round</button>
      </div>
    </section>

    <section id="phase-banner" class="phase-banner hidden">
      <div id="phase-text"></div>
      <div id="phase-cycle" class="muted"></div>
    </section>

    <section id="tow-view" class="tow hidden">
      <div class="tow-head">
        <div class="tow-team" data-team="pink">
          <div class="tow-label">PINK</div>
          <div class="meter"><div id="force-pink"></div></div>
          <div class="muted tow-names" id="names-pink"></div>
        </div>
        <div class="tow-center">
          <div class="tow-big" id="tow-big"></div>
          <div class="muted" id="tow-timer"></div>
        </div>
        <div class="tow-team" data-team="teal">
          <div class="tow-label">TEAL</div>
          <div class="meter"><div id="force-teal"></div></div>
          <div class="muted tow-names" id="names-teal"></div>
        </div>
      </div>
      <div class="rope-track">
        <span class="win-line pink"></span>
        <span class="center-line"></span>
        <span class="win-line teal"></span>
        <div class="rope"></div>
        <div class="knot" id="knot"></div>
      </div>
    </section>

    <section id="results" class="results hidden"></section>

    <p><strong id="count">0</strong> <span class="muted">players</span></p>
    <p class="error" id="host-error"></p>
    <section class="players" id="players"></section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
